name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify debug keystore checksum
        run: |
          EXPECTED="a9fe19d27688ada8e7f158cd02f8a8e74ccd7bdff65f45011dce1f67bdd93e26"
          ACTUAL=$(sha256sum app/debug.keystore | awk '{print $1}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Checksum mismatch for app/debug.keystore: expected $EXPECTED, got $ACTUAL"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK, run unit tests and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: thumbline-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon

  release:
    needs: [build, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: thumbline-debug-apk
          path: apk

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apk/*.apk thumbline.apk
          gh release create "build-${{ github.run_number }}" thumbline.apk \
            --title "build-${{ github.run_number }}" \
            --generate-notes \
            --latest

