name: Build APK

on:
  workflow_dispatch:
    inputs:
      number:
        description: "Release number N (version code is 113 + N). Blank = last build tag + 1."
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      number: ${{ steps.num.outputs.n }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release number
        id: num
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.number }}
        run: |
          if [ -n "$INPUT" ]; then
            N="$INPUT"
          else
            LAST=$(gh release list --limit 200 --json tagName --jq '.[].tagName' \
              | sed -n 's/^build-\([0-9][0-9]*\)$/\1/p' | sort -n | tail -n 1)
            N=$(( ${LAST:-0} + 1 ))
          fi
          case "$N" in
            ''|*[!0-9]*) echo "Invalid release number: $N"; exit 1 ;;
          esac
          echo "Release number: $N (version code $((113 + N)))"
          echo "n=$N" >> "$GITHUB_OUTPUT"

      - name: Verify debug keystore checksum
        run: |
          EXPECTED="a9fe19d27688ada8e7f158cd02f8a8e74ccd7bdff65f45011dce1f67bdd93e26"
          ACTUAL=$(sha256sum app/debug.keystore | awk '{print $1}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Checksum mismatch for app/debug.keystore: expected $EXPECTED, got $ACTUAL"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test dictionary trimming and bundled data
        run: python3 -m unittest discover -s tools/tests -v

      - name: Build debug APK, run unit tests and lint
        env:
          GITHUB_RUN_NUMBER: ${{ steps.num.outputs.n }}
        run: ./gradlew assembleRelease testDebugUnitTest lintDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: thumbline-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: thumbline-release-apk
          path: apk

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ needs.build.outputs.number }}
        run: |
          cp apk/*.apk thumbline.apk
          gh release create "build-$NUMBER" thumbline.apk \
            --title "build-$NUMBER" \
            --generate-notes \
            --latest

